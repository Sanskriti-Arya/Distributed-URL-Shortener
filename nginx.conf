events { worker_connections 4096; }

http {
  upstream api {
    least_conn;
    server api1:8000 max_fails=2 fail_timeout=5s;
    server api2:8000 max_fails=2 fail_timeout=5s;
    server api3:8000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # edge proxy: overwrite, never trust client-supplied
      proxy_next_upstream error timeout http_502 http_503;  # retry another API node if one dies
      proxy_connect_timeout 1s;
    }
  }
}
